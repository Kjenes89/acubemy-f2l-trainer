<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F2L-trener</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>F2L-trener</h1>
  <span id="device" class="warn">Venter på acubemy …</span>
</header>

<div class="bar">
  <div class="seg">
    <button data-mode="drill" class="on">Drill</button>
    <button data-mode="guided">Guidet</button>
  </div>
  <label class="chk"><input type="checkbox" id="short"> Kort oppsett</label>
  <button id="toggle-picker">Caser · <span id="sel-count"></span></button>
  <button id="calib" title="Hold hvit ned og grønn foran, og trykk">Kalibrer gyro</button>
  <button id="sync" title="Hent kubetilstanden fra acubemy på nytt (hvis skjermen og kuben er ulike)">Synk med kuben</button>
  <button id="skip">Hopp over</button>
</div>

<div id="picker-wrap" hidden>
  <div class="bar small">
    <button id="sel-asker">Asker-utvalget (7, 8, 9, 16, 33)</button>
    <button id="sel-all">Alle</button>
    <button id="sel-none">Ingen</button>
  </div>
  <div id="picker"></div>
</div>

<main>
  <section id="main" class="panel">
    <div id="cube3d"></div>
    <div id="phase"></div>
  </section>
  <aside>
    <section class="panel"><h2>Siste</h2><div id="result"></div></section>
    <section class="panel"><h2>Økta</h2><div id="stats"></div></section>
  </aside>
</main>

<footer class="muted small"><span id="diag"></span><br>M1.2 · FR-spor · hold hvit ned og grønn foran · algoritmene vises som i boka, sammenligningen skjer uten rotasjoner</footer>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script src="https://cdn.jsdelivr.net/gh/acubemy/plugin-sdk@1/v1.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
